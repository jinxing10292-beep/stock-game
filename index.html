<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>모의 주식 게임</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%232563eb'>📈</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- 헤더 -->
        <header class="header">
            <div class="header-top">
                <h1 class="app-title">📈 Stock Game</h1>
                <div class="header-controls">
                    <button class="btn-theme" id="themeToggle" title="다크모드">🌙</button>
                    <button class="btn-menu" id="menuToggle" title="메뉴">☰</button>
                </div>
            </div>

            <!-- 자산 정보 카드 -->
            <div class="asset-cards">
                <div class="asset-card">
                    <span class="asset-label">총 자산</span>
                    <span class="asset-value" id="totalAssets">₩1,000,000</span>
                    <span class="asset-change" id="totalChange">0%</span>
                </div>
                <div class="asset-card">
                    <span class="asset-label">현금</span>
                    <span class="asset-value" id="cashBalance">₩1,000,000</span>
                </div>
                <div class="asset-card">
                    <span class="asset-label">투자금</span>
                    <span class="asset-value" id="investedAmount">₩0</span>
                </div>
                <div class="asset-card">
                    <span class="asset-label">환율</span>
                    <span class="asset-value" id="exchangeRateDisplay">₩1,381.93</span>
                    <span class="asset-change" style="font-size: 11px;">USD/KRW</span>
                </div>
            </div>
        </header>

        <!-- 메인 네비게이션 -->
        <nav class="main-nav">
            <button class="nav-btn active" data-tab="stocks">📊 주식</button>
            <button class="nav-btn" data-tab="portfolio">💼 포트폴리오</button>
            <button class="nav-btn" data-tab="history">📋 거래기록</button>
            <button class="nav-btn" data-tab="settings">⚙️ 설정</button>
        </nav>

        <!-- 메인 콘텐츠 -->
        <main class="main-content">
            <!-- 주식 섹션 -->
            <section class="tab-content active" id="stocks-tab">
                <div class="stocks-controls">
                    <div class="search-bar">
                        <input 
                            type="text" 
                            id="searchInput" 
                            placeholder="주식명 또는 종목코드 검색..." 
                            class="search-input"
                        >
                        <span class="search-icon">🔍</span>
                    </div>
                    <div class="filter-controls">
                        <select id="sortSelect" class="sort-select">
                            <option value="name">이름순</option>
                            <option value="change">변동률순</option>
                            <option value="price">가격순</option>
                        </select>
                    </div>
                </div>

                <div id="stocksList" class="stocks-list">
                    <!-- 동적으로 생성됨 -->
                </div>
            </section>

            <!-- 포트폴리오 섹션 -->
            <section class="tab-content" id="portfolio-tab">
                <div class="portfolio-header">
                    <h2>💼 포트폴리오</h2>
                    <div class="portfolio-summary">
                        <div class="summary-item">
                            <span>총 수익/손실</span>
                            <span id="totalProfit" class="value-positive">₩0</span>
                        </div>
                        <div class="summary-item">
                            <span>수익률</span>
                            <span id="totalProfitRate" class="value-positive">0%</span>
                        </div>
                    </div>
                </div>
                <div id="portfolio" class="portfolio-grid">
                    <!-- 동적으로 생성됨 -->
                </div>
            </section>

            <!-- 거래 기록 섹션 -->
            <section class="tab-content" id="history-tab">
                <div class="history-header">
                    <h2>📋 거래 기록</h2>
                    <button id="clearHistoryBtn" class="btn btn-small">기록 삭제</button>
                </div>
                <div id="tradeHistory" class="trade-history">
                    <!-- 동적으로 생성됨 -->
                </div>
            </section>

            <!-- 설정 섹션 -->
            <section class="tab-content" id="settings-tab">
                <div class="settings-panel">
                    <h2>⚙️ 설정</h2>
                    <div class="settings-group">
                        <h3>게임 설정</h3>
                        <div class="setting-item">
                            <label>초기 자금</label>
                            <span id="initialCapitalDisplay" style="font-weight: 700; color: var(--primary-color);">₩10,000,000</span>
                            <p style="font-size: 12px; color: var(--neutral-text); margin-top: 8px;">초기 자금은 1000만원으로 고정되어 있습니다.</p>
                        </div>
                    </div>
                    <div class="settings-group">
                        <h3>데이터 관리</h3>
                        <div class="button-group">
                            <button id="exportDataBtn" class="btn btn-secondary">데이터 내보내기</button>
                            <button id="importDataBtn" class="btn btn-secondary">데이터 가져오기</button>
                            <button id="resetGameBtn" class="btn btn-danger">게임 초기화</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 숨겨진 파일 입력 -->
        <input type="file" id="fileInput" accept=".json" style="display: none;">
    </div>

    <!-- 주식 상세 모달 -->
    <div id="stockDetailModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content stock-detail-modal">
            <div id="stockDetailContainer">
                <!-- 동적으로 생성됨 -->
            </div>
        </div>
    </div>

    <!-- 거래 모달 -->
    <div id="tradeModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">주식 거래</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-info">
                    <div class="info-item">
                        <span class="label">종목</span>
                        <span id="modalStockName" class="value"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">현재가</span>
                        <span id="modalCurrentPrice" class="value"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">변동률</span>
                        <span id="modalChangeRate" class="value"></span>
                    </div>
                    <div class="info-item">
                        <span class="label">보유량</span>
                        <span id="modalHoldingQty" class="value"></span>
                    </div>
                </div>

                <div class="trade-form">
                    <div class="quantity-group">
                        <label>거래 수량</label>
                        <div class="quantity-controls">
                            <button class="btn-qty" id="qtyMinusBtn">−</button>
                            <input type="number" id="tradeQuantity" min="1" value="1" class="qty-input">
                            <button class="btn-qty" id="qtyPlusBtn">+</button>
                        </div>
                    </div>

                    <div class="trade-cost">
                        <span>예상 금액</span>
                        <span id="estimatedCost">₩0</span>
                    </div>

                    <div class="trade-buttons">
                        <button id="buyBtn" class="btn btn-buy">매수</button>
                        <button id="sellBtn" class="btn btn-sell">매도</button>
                    </div>
                </div>

                <div id="tradeMessage" class="trade-message"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
